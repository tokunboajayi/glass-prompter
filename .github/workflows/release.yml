name: Release

# Push a tag like v2.0.0 to build the Windows installer and the macOS apps and attach them to the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build installer
        shell: pwsh
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.sha256.txt

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest        # Apple silicon
          - runner: macos-15-intel      # Intel Macs
    runs-on: ${{ matrix.runner }}
    # Developer ID signing + notarization. All optional: with no secrets the build is ad-hoc signed as before.
    # See RELEASING.md "Code signing" for what each secret holds.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          if [ -z "$ID" ]; then echo "No 'Developer ID Application' identity in MACOS_CERT_P12"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "Signing as: $ID"
      - name: Write the notary API key
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build app and disk image
        run: bash packaging/build_mac.sh
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.sha256.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Glass Prompter ${TAG#v}" --notes-file packaging/RELEASE_NOTES.md
          gh release upload "$TAG" out/* --clobber
