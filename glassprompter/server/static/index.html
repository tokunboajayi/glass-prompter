<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Glass Prompter Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-text-sm" viewBox="0 0 24 24"><path d="M7 17l3.5-9 3.5 9M8.3 14h4.4"/></symbol>
    <symbol id="i-text-lg" viewBox="0 0 24 24"><path d="M4 19l6-15 6 15M6.2 13.5h7.6M18 6v6M15 9h6"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></symbol>
    <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M5 20V10a7 7 0 0 1 14 0v10l-2.3-1.6L14.3 20 12 18.4 9.7 20l-2.4-1.6z"/><circle cx="9.5" cy="10.5" r=".9" fill="currentColor"/><circle cx="14.5" cy="10.5" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></symbol>
  </defs>
</svg>
<main>
  <header>
    <h1><img src="/icon.svg" alt="" width="24" height="24"> Prompter</h1>
    <span id="conn" class="pill"><i></i><span>Connecting</span></span>
  </header>

  <!-- pairing -->
  <section id="pairView" class="card" hidden>
    <h2>Enter the 6-digit PIN</h2>
    <p class="hint">On your PC, click the prompter and press <b>P</b> to see it.</p>
    <form id="pairForm" autocomplete="off">
      <input id="pin" class="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-label="PIN" required>
      <button class="btn primary wide" type="submit">Connect</button>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card status" aria-live="polite">
      <div class="row-between">
        <b id="stateText">Paused</b>
        <span id="meta" class="muted"></span>
      </div>
      <div id="scriptTitle" class="script-title"></div>
      <div class="bar"><div id="prog"></div></div>
      <div id="queued" class="note" hidden>New script waiting. Pause to load it.</div>
    </section>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="remote" aria-selected="true">Remote</button>
      <button role="tab" data-tab="library" aria-selected="false">Library</button>
      <button role="tab" data-tab="write" aria-selected="false">Write</button>
    </nav>

    <section id="tab-remote" role="tabpanel">
      <div class="grid">
        <button class="btn primary full" data-action="play"><svg id="ppIcon" class="ic" aria-hidden="true"><use href="#i-play"/></svg><span id="ppText">Play</span></button>
        <button class="btn" data-action="back"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg><small>Back</small></button>
        <button class="btn" data-action="restart"><svg class="ic" aria-hidden="true"><use href="#i-restart"/></svg><small>Restart</small></button>
        <button class="btn" data-action="ahead"><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg><small>Ahead</small></button>
        <button class="btn" data-action="slower"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg><small>Slower</small></button>
        <button class="btn" data-action="faster"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><small>Faster</small></button>
        <button class="btn" data-action="hide"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg><small>Hide / show</small></button>
        <button class="btn half" data-action="smaller"><svg class="ic" aria-hidden="true"><use href="#i-text-sm"/></svg><small>Smaller</small></button>
        <button class="btn half" data-action="bigger"><svg class="ic" aria-hidden="true"><use href="#i-text-lg"/></svg><small>Bigger</small></button>
        <button id="voiceBtn" class="btn half" data-action="voice"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg><small id="voiceText">Voice Follow off</small></button>
        <button id="ghostBtn" class="btn half" data-action="ghost"><svg class="ic" aria-hidden="true"><use href="#i-ghost"/></svg><small id="ghostText">Ghost mode off</small></button>
        <button class="btn half" data-action="ghost_less"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg><small>More see-through</small></button>
        <button class="btn half" data-action="ghost_more"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><small>More solid</small></button>
        <button class="btn full-soft" data-action="read_aloud"><svg class="ic" aria-hidden="true"><use href="#i-speaker"/></svg><small>Read my script aloud</small></button>
      </div>
      <div id="secWrap" hidden>
        <p class="hint">Sections</p>
        <div class="row-2">
          <button class="btn" data-action="prev_section"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg><small>Previous section</small></button>
          <button class="btn" data-action="next_section"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg><small>Next section</small></button>
        </div>
        <div id="secList" class="chips"></div>
      </div>
    </section>

    <section id="tab-library" role="tabpanel" hidden>
      <input id="search" class="field" type="search" placeholder="Search scripts" aria-label="Search scripts">
      <ul id="list" class="list"></ul>
      <p id="empty" class="hint center" hidden>No scripts yet. Write one or upload a file.</p>
    </section>

    <section id="tab-write" role="tabpanel" hidden>
      <div class="row-between">
        <span id="editing" class="muted">New script</span>
        <button id="newBtn" class="link" type="button" hidden>Start a new one</button>
      </div>
      <input id="title" class="field" maxlength="120" placeholder="Title (optional)" aria-label="Title">
      <textarea id="body" class="field" placeholder="Paste or type your script.&#10;&#10;# Heading on its own line starts a section.&#10;[PAUSE] on its own line stops the scroll.&#10;[ANY CUE] on its own line shows in orange." aria-label="Script"></textarea>
      <p id="count" class="hint">0 words</p>
      <div class="actions">
        <button id="saveLoad" class="btn primary" type="button">Save &amp; load</button>
        <button id="save" class="btn" type="button">Save</button>
      </div>
      <label class="upload">&#8682; Upload .txt, .md or .docx
        <input id="file" type="file" accept=".txt,.md,.docx" hidden>
      </label>
    </section>
  </div>
</main>
<div id="toast" role="status"></div>
</body>
</html>
